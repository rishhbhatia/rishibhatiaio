---
layout: default
---
<article class="container container--prose">
  <header class="page-header">
    <h1 class="page-header__title">{{ page.title }}</h1>
    {% if page.lead %}<p class="page-header__lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="prose" style="padding-bottom: 6rem;">
    {{ content }}
  </div>
</article>
