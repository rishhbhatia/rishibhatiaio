<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/dm-serif-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>document.documentElement.classList.remove('no-js');</script>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  {% if page.url == "/" or page.url == "/about/" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Rishi Bhatia",
    "url": "{{ site.url }}/",
    "image": "{{ site.url }}/assets/images/rishi-profile.jpg",
    "jobTitle": "Data & AI strategist and engineer",
    "email": "mailto:{{ site.email }}",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "San Francisco",
      "addressRegion": "CA",
      "addressCountry": "US"
    },
    "worksFor": {
      "@type": "Organization",
      "name": "Ceroh",
      "url": "https://www.ceroh.ai"
    },
    "sameAs": [
      "https://www.linkedin.com/in/rishhbhatia",
      "https://github.com/rishhbhatia",
      "https://www.ceroh.ai"
    ]
  }
  </script>
  {% endif %}
  {% if jekyll.environment == "production" %}
  <!-- GoatCounter: privacy-friendly analytics, no cookies. Register the
       "rishibhatia" code at goatcounter.com to activate the dashboard. -->
  <script data-goatcounter="https://rishibhatia.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  {% endif %}
</head>
