# Site settings
title: Rishi Bhatia
tagline: Data & AI strategist and engineer
description: >-
  Data & AI strategist and engineer in San Francisco. A decade building
  data and AI systems at scale — previously Meta, Deloitte, and AI & data startups.
email: rishi@rishibhatia.io
domain: rishibhatia.io
url: "https://www.rishibhatia.io"
author:
  name: Rishi Bhatia
  twitter: rishhbhatia

twitter_username: rishhbhatia
github_username: rishhbhatia
linkedin_username: rishhbhatia

twitter:
  username: rishhbhatia
  card: summary_large_image

social:
  name: Rishi Bhatia
  links:
    - https://www.linkedin.com/in/rishhbhatia
    - https://github.com/rishhbhatia
    - https://twitter.com/rishhbhatia

# Default social image (pages can override with page.image)
image: /assets/og/default.png

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: "work"
    values:
      layout: case-study
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

feed:
  categories:
    - writing

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - REDESIGN_LOG.md
  - DESIGN_SYSTEM.md
  - vendor
  - node_modules
  - tools
